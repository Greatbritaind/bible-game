<!doctype html><html><body><script type="module">
import { RubyVM } from "@ruby/wasm-wasi";
import { WASI, OpenFile, File, ConsoleStdout, PreopenDirectory } from "@bjorn3/browser_wasi_shim";
const mod = await WebAssembly.compileStreaming(fetch("/ruby.wasm"));
const wasi = new WASI([], ["RUBY_FIBER_MACHINE_STACK_SIZE=67108864", "RUBY_FIBER_VM_STACK_SIZE=16777216", "RUBY_THREAD_VM_STACK_SIZE=16777216"], [new OpenFile(new File([])), ConsoleStdout.lineBuffered(l=>console.log("[ruby] "+l)), ConsoleStdout.lineBuffered(l=>console.log("[ruby] "+l)), new PreopenDirectory("/", new Map())]);
const { vm } = await RubyVM.instantiateModule({ module: mod, wasip1: wasi });
window.w = () => new Promise(r => setTimeout(() => r(1), 0));
await vm.evalAsync(`
require "js"
def deep(n, &b) = n == 0 ? b.call : deep(n - 1, &b)
def deep_blk(n, &b) = n == 0 ? b.call : [1].each { deep_blk(n - 1, &b) }
[50, 100, 200, 400, 800, 1600].each do |n|
  begin
    deep(n) { JS.global.call(:w).await }
    puts "plain depth #{n}: ok"
  rescue Exception => e
    puts "plain depth #{n}: #{e.class} #{e.message}"
  end
end
[25, 50, 100, 200, 400, 800].each do |n|
  begin
    deep_blk(n) { JS.global.call(:w).await }
    puts "block depth #{n}: ok"
  rescue Exception => e
    puts "block depth #{n}: #{e.class} #{e.message}"
  end
end
begin
  deep(5000) { 1 }
  puts "no-await depth 5000 ok"
rescue Exception => e
  puts "no-await 5000: #{e.class}"
end
`);
window.__done = true;
</script></body></html>
