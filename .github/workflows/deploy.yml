name: Build and publish the game

# Runs whenever something is pushed to main (for example, an updated game/ folder),
# or by hand from the Actions tab. Takes a few minutes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npm run setup

      - name: Pack the game
        run: |
          pip3 install rpzip
          cd game
          # Windows-only and editor files aren't needed in the browser
          rm -rf PBS ./*.exe ./*.dll ./*.html ./*.txt ./*.URL ./*.bmp ./*.nc Game.rxproj
          # Always use the same game name: saves are stored under it
          sed -i -E 's/^(\s*)("windowTitle":\s*)"[^"]*"/\1\2"Road to Jerusalem"/' mkxp.json
          grep '"windowTitle"' mkxp.json
          # Files are stored uncompressed so the player can read them without unpacking
          rpzip -r ../public/game.mkxpz ./*
          # Content fingerprints: players' browsers re-download a file only when it really changed
          GAME_V=$(find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          RUBY_V=$(sha256sum ../public/ruby.wasm | cut -c1-16)
          echo "{\"game.mkxpz\": \"$GAME_V\", \"ruby.wasm\": \"$RUBY_V\"}" > ../public/versions.json
          cat ../public/versions.json
          ls -lh ../public

      - name: Build the page
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
